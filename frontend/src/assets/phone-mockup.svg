<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 606" width="280" height="606" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset=".42" stop-color="#F9A8D4"/><stop offset=".68" stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E7490" stop-opacity=".55"/><stop offset="1" stop-color="#1E3A8A" stop-opacity=".85"/></linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86EFAC"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <clipPath id="screen"><rect x="8" y="8" width="264" height="590" rx="32"/></clipPath>
  </defs>

  <!-- device body -->
  <rect width="280" height="606" rx="40" fill="#111827"/>
  <g clip-path="url(#screen)">
    <rect x="8" y="8" width="264" height="590" fill="#fff"/>

    <!-- status bar -->
    <text x="28" y="31" font-size="11" font-weight="700" fill="#111827">9:41</text>
    <rect x="109" y="20" width="62" height="15" rx="7.5" fill="#111827"/>
    <rect x="236" y="23" width="18" height="9" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
    <rect x="238" y="25" width="10" height="5" rx="1" fill="#111827"/>

    <!-- app bar -->
    <text x="22" y="62" font-size="16" font-weight="800" letter-spacing="-.5" fill="url(#brand)">Connectly</text>
    <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232 54a5 5 0 0 0-10 0c0 6-2.5 7.5-2.5 7.5h15S232 60 232 54"/>
      <line x1="256" y1="48" x2="245" y2="59"/>
      <polygon points="256 48 250 64 245 59 240 55 256 48"/>
    </g>

    <!-- stories -->
    <g>
      <circle cx="45" cy="97" r="23" fill="url(#ring)"/><circle cx="45" cy="97" r="19.5" fill="#fff"/><circle cx="45" cy="97" r="17.5" fill="url(#a1)"/>
      <circle cx="102" cy="97" r="23" fill="url(#ring)"/><circle cx="102" cy="97" r="19.5" fill="#fff"/><circle cx="102" cy="97" r="17.5" fill="url(#a2)"/>
      <circle cx="159" cy="97" r="23" fill="url(#ring)"/><circle cx="159" cy="97" r="19.5" fill="#fff"/><circle cx="159" cy="97" r="17.5" fill="url(#a3)"/>
      <circle cx="216" cy="97" r="23" fill="url(#ring)"/><circle cx="216" cy="97" r="19.5" fill="#fff"/><circle cx="216" cy="97" r="17.5" fill="url(#a4)"/>
    </g>

    <!-- post header -->
    <circle cx="36" cy="147" r="14" fill="url(#av)"/>
    <text x="36" y="150" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">AV</text>
    <text x="56" y="144" font-size="11.5" font-weight="700" fill="#111827">ava.explores</text>
    <text x="56" y="157" font-size="9.5" fill="#6B7280">Algarve, Portugal</text>

    <!-- photo -->
    <rect x="8" y="171" width="264" height="258" fill="url(#photo)"/>
    <circle cx="140" cy="285" r="35" fill="#fff" fill-opacity=".85"/>
    <rect x="8" y="345" width="264" height="84" fill="url(#sea)"/>

    <!-- actions -->
    <path d="M32 448a5.5 5.5 0 0 0-7.8 0L23 449.2l-1.2-1.2a5.5 5.5 0 0 0-7.8 7.8l1.2 1.2 7.8 7.8 7.8-7.8 1.2-1.2a5.5 5.5 0 0 0 0-7.8z" fill="#EC4899" transform="translate(4 -2)"/>
    <circle cx="62" cy="456" r="8" fill="none" stroke="#111827" stroke-width="2"/>
    <polygon points="84 448 94 464 94 452" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <path d="M250 447h-10v18l5-4 5 4z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>

    <!-- caption -->
    <text x="22" y="484" font-size="10.5" font-weight="700" fill="#111827">1,248 likes</text>
    <text x="22" y="498" font-size="10.5" fill="#111827"><tspan font-weight="700">ava.explores</tspan> Golden hour never gets old.</text>

    <!-- tab bar -->
    <line x1="8" y1="550" x2="272" y2="550" stroke="#E5E7EB"/>
    <g fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 574l8-6 8 6v9h-16z"/>
      <circle cx="100" cy="573" r="6"/><line x1="105" y1="578" x2="109" y2="582"/>
      <rect x="132" y="567" width="16" height="16" rx="2"/><line x1="140" y1="571" x2="140" y2="579"/><line x1="136" y1="575" x2="144" y2="575"/>
      <path d="M200 575c0-3-2-4-4-4s-4 1-4 4c0 4 8 8 8 8s8-4 8-8c0-3-2-4-4-4s-4 1-4 4z" transform="translate(0 -3) translate(-4 0)"/>
      <circle cx="240" cy="570" r="4"/><path d="M232 584v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>
    </g>
  </g>
</svg>
